<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guarda-Roupa · Laura Corrêa</title>
<meta name="description" content="Guarda-roupa digital da Laura: peças recortadas, looks por estação e geração de imagem.">
<meta name="theme-color" content="#0E0E10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230E0E10'/><path d='M50 22c-7 0-12 5-12 11 0 4 2 7 5 9L20 56c-3 2-5 4-5 7 0 4 3 7 8 7h54c5 0 8-3 8-7 0-3-2-5-5-7L57 42c3-2 5-5 5-9 0-6-5-11-12-11z' fill='%23F5A15C'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="brand">
        <h1 class="d1">Guarda-<br>Roupa</h1>
        <span class="sticker" id="count">182 peças</span>
      </div>
      <div class="top-acts">
        <button class="sq" id="btnAdd" title="Adicionar peça" aria-label="Adicionar peça">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="sq" id="btnCfg" title="Configurar IA" aria-label="Configurar IA">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.7 4.7l1.9 1.9M17.4 17.4l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.7 19.3l1.9-1.9M17.4 6.6l1.9-1.9"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav" role="tablist">
      <button role="tab" id="tabPecas" aria-selected="true">Peças</button>
      <button role="tab" id="tabLooks" aria-selected="false">Outfits</button>
    </nav>
  </div>
  <div class="wrap"><div class="rail" id="rail"></div></div>
</header>

<main class="wrap">
  <section id="viewPecas">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input id="q" type="search" placeholder="buscar peça, cor ou tipo" autocomplete="off">
    </div>
    <div class="meta lbl"><span id="cPecas">—</span><span>toque pra abrir</span></div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="viewLooks" hidden>
    <div class="meta lbl"><span id="cLooks">—</span><span id="fila"></span></div>
    <div id="looksWrap"></div>
  </section>
</main>

<div class="dock">
  <button class="btn solid" id="btnMontar">
    <svg viewBox="0 0 24 24"><path d="M12 3 4 7v4c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V7z"/></svg>
    Montar look
  </button>
</div>

<input type="file" id="filePick" accept="image/*" hidden>
<div id="modalRoot"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
